[package]
name = "whp"
edition.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
guid.workspace = true
pal.workspace = true
parking_lot.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
criterion = { workspace = true, features = ["rayon", "cargo_bench_support"] }
test_with_tracing.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Memory", "Win32_System_Threading"] }

[[bench]]
name = "primitives"
harness = false

[[bin]]
name = "whp-legacy-cpuid-probe"
path = "src/bin/legacy_cpuid_probe.rs"

[lints]
workspace = true
